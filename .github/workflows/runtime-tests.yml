name: Runtime Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  runtime-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Runtime contract checks
        run: node dist/demos/run-result-contract-test.js

      - name: Production runtime integration checks
        run: node dist/demos/production-runtime-integration-test.js
