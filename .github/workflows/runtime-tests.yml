name: Runtime Tests

on:
  push:
    branches: [main, day43-noon-ci, day44-noon-ready, day44-evening-ops, day44-evening-ci, day45-morning-outbox, day45-noon-ci, day46-noon-committer, day46-evening-transactional-orchestrator]
  pull_request:

jobs:
  runtime-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Runtime contract checks
        run: node dist/demos/run-result-contract-test.js

      - name: Production runtime integration checks
        run: node dist/demos/production-runtime-integration-test.js

      - name: Resilient cancellation regression
        run: node dist/demos/resilient-cancellation-test.js

      - name: Durable recovery regression
        run: node dist/demos/durable-recovery-test.js

      - name: Checkpoint conflict recovery regression
        run: node dist/demos/checkpoint-recovery-coordinator-test.js

      - name: Persistent checkpoint restart and CAS
        run: node dist/demos/persistent-checkpoint-test.js

      - name: Transactional checkpoint multi-instance CAS
        run: node dist/demos/transactional-checkpoint-test.js


      - name: SQLite checkpoint restart and CAS
        run: node dist/demos/sqlite-checkpoint-test.js

      - name: SQLite crash recovery integration
        run: node dist/demos/sqlite-recovery-integration-test.js

      - name: Recovery observability regression
        run: node dist/demos/recovery-observability-test.js

      - name: Recovery operation service regression
        run: node dist/demos/recovery-operations-test.js

      - name: Recovery operation lifecycle regression
        run: node dist/demos/recovery-operation-lifecycle-test.js

      - name: Recovery preparation regression
        run: npm run test:recovery-preparation

      - name: Recovery transition committer regression
        run: npm run test:recovery-committer

      - name: SQLite transactional recovery committer regression
        run: npm run test:sqlite-recovery-committer

      - name: Durable recovery command and outbox regression
        run: node dist/demos/recovery-command-outbox-test.js
