name: Runtime Tests

on:
  push:
    branches: [main, day43-noon-ci, day44-noon-ready, day44-evening-ops, day44-evening-ci, day45-morning-outbox, day45-noon-ci, day46-noon-committer, day46-evening-transactional-orchestrator, day47-noon-durable-orchestrator]
  pull_request:

jobs:
  runtime-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        id: build
        shell: bash
        run: |
          if ! npm run build > /tmp/tsc-build.log 2>&1; then
            cat /tmp/tsc-build.log
            message="$(grep -m1 'error TS' /tmp/tsc-build.log | tr '\n' ' ' | cut -c1-180)"
            echo "detail=${message:-unknown-typescript-error}" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          cat /tmp/tsc-build.log

      - name: Build diagnostic — ${{ steps.build.outputs.detail }}
        if: failure()
        run: echo "See TypeScript error in previous step"

      - name: Runtime contract checks
        run: node dist/demos/run-result-contract-test.js

      - name: Production runtime integration checks
        run: node dist/demos/production-runtime-integration-test.js

      - name: Resilient cancellation regression
        run: node dist/demos/resilient-cancellation-test.js

      - name: Durable recovery regression
        run: node dist/demos/durable-recovery-test.js

      - name: Checkpoint conflict recovery regression
        run: node dist/demos/checkpoint-recovery-coordinator-test.js

      - name: Persistent checkpoint restart and CAS
        run: node dist/demos/persistent-checkpoint-test.js

      - name: Transactional checkpoint multi-instance CAS
        run: node dist/demos/transactional-checkpoint-test.js


      - name: SQLite checkpoint restart and CAS
        run: node dist/demos/sqlite-checkpoint-test.js

      - name: SQLite crash recovery integration
        run: node dist/demos/sqlite-recovery-integration-test.js

      - name: Recovery observability regression
        run: node dist/demos/recovery-observability-test.js

      - name: Recovery operation service regression
        run: node dist/demos/recovery-operations-test.js

      - name: Recovery operation lifecycle regression
        run: node dist/demos/recovery-operation-lifecycle-test.js

      - name: Recovery preparation regression
        run: npm run test:recovery-preparation

      - name: Recovery transition committer regression
        run: npm run test:recovery-committer

      - name: SQLite transactional recovery committer regression
        run: npm run test:sqlite-recovery-committer

      - name: Day 63 compatibility contract structure
        run: node scripts/day63-contract-landing.mjs .

      - name: Day 63 compatibility contract regression
        run: node --test scripts/tests/day63-contract-landing.test.mjs

      - name: SQLite recovery finalization unit-of-work regression
        run: npm run test:recovery-unit-of-work

      - name: Day 64 selective Finalizer SQLite integration
        run: npm run test:selective-recovery-unit-of-work

      - name: Day 64 pure Control preparation + SQLite transaction
        run: node dist/demos/day64-control-preparation-test.js

      - name: Day 65 atomic route decision contract
        run: node dist/demos/day65-atomic-route-decision-test.js

      - name: Day 65 same-DB atomic Control-only integration
        run: node dist/demos/day65-atomic-control-only-integration-test.js

      - name: Day 65 in-flight recovery evidence and replay
        run: npm run test:recovery-inflight-evidence

      - name: Day 66 exclusive Recovery entry ownership regression
        run: node dist/demos/day66-recovery-entry-dispatcher-test.js

      - name: Day 66 SQLite fault injection and durable owner flip
        run: npm run test:recovery-entry-sqlite-fault

      - name: Day 67 shared transactional owner Claim and mixed-route SQLite race
        run: npm run test:shared-recovery-claim

      - name: Day 67 evening competing Run CAS and claim-required entry
        run: npm run test:recovery-run-level-cas

      - name: Day 68 authenticated recovery ingress guard regression
        run: node dist/demos/day68-recovery-ingress-gate-test.js

      - name: Day 68 noon ingress authorization and replay on real SQLite
        run: npm run test:recovery-ingress-sqlite

      - name: Day 68 evening ingress replay and safe response contracts
        run: npm run test:recovery-ingress-evening

      - name: Day 69 authorization evidence identity and ACL revision invariants
        run: npm run test:recovery-authorization-evidence

      - name: Day 69 noon ACL drift same-SQLite authorized Claim
        run: npm run test:recovery-authorized-claim

      - name: Day 69 evening revocation-after-Claim Finalizer authorization fence
        run: npm run test:recovery-authorization-finalize-fence

      - name: Day 70 morning external effect fence identity contract
        run: npm run test:recovery-external-effect-fence

      - name: Day 70 noon same-SQLite effect ledger and monotonic epochs
        run: npm run test:recovery-effect-ledger

      - name: Day 70 evening remote effect UNKNOWN reconciliation and lost ACK
        run: npm run test:recovery-effect-reconciliation

      - name: Day 71 morning provider capability audit
        run: npm run test:recovery-provider-capabilities

      - name: Day 71 noon provider matrix, trusted registry and fail-closed candidate review
        run: npm run test:recovery-provider-matrix

      - name: Day 71 evening contract drift, quarantine and lost-ACK review
        run: npm run test:recovery-provider-conformance

      - name: Day 72 morning authenticated remote receipt review contract
        run: npm run test:recovery-remote-receipt-review

      - name: Day 72 noon same-SQLite trusted remote receipt persistence and uniqueness
        run: npm run test:recovery-remote-receipt-persistence

      - name: Day 72 evening remote receipt to terminal review, revocation and CAS
        run: npm run test:recovery-remote-receipt-terminal-review

      - name: Durable recovery command and outbox regression
        run: node dist/demos/recovery-command-outbox-test.js

      - name: Durable recovery operation orchestrator regression
        run: npm run test:durable-recovery-operation

      - name: Day 73 morning receipt consumption CAS contract
        run: npm run test:recovery-receipt-consumption-contract

      - name: Day 73 noon same-SQLite remote receipt consumption and terminal CAS
        run: npm run test:recovery-receipt-consumption-sqlite

      - name: Day 73 evening receipt terminal replay integrity and generic Finalizer bypass
        run: npm run test:recovery-receipt-finalizer-boundary

      - name: Day 74 morning outbox delivery idempotency contract
        run: npm run test:recovery-outbox-delivery-contract

      - name: Day 74 noon same-SQLite Outbox lease and authenticated ACK candidate
        run: npm run test:recovery-outbox-delivery-lease

      - name: Day 74 evening consumer inbox ACK-loss and atomic dedupe regression
        run: npm run test:recovery-outbox-consumer-dedupe

      - name: Day 75 noon authenticated ACK candidate
        run: npm run test:recovery-authenticated-ack

      - name: Day 75 evening dispatcher cutover candidate
        run: npm run test:recovery-dispatcher-cutover

      - name: Day 76 noon cutover bootstrap
        run: npm run test:recovery-cutover-bootstrap

      - name: Day 76 evening cutover evidence recheck
        run: npm run test:recovery-cutover-recheck

      - name: Day 77 noon SQLite writer epoch
        run: npm run test:recovery-writer-epoch

      - name: Day 77 evening old-writer bypass
        run: npm run test:recovery-writer-epoch-evening

      - name: Day 78 noon fenced outbox
        run: npm run test:recovery-fenced-outbox

      - name: Day 78 evening fenced outbox boundary
        run: npm run test:recovery-fenced-outbox-evening

      - name: Day 79 noon single writer candidate
        run: npm run test:recovery-single-writer-candidate

      - name: Day 79 evening release proof review
        run: npm run test:recovery-single-writer-release

      - name: Day 80 noon isolation plan fail-closed policy
        run: npm run test:recovery-writer-isolation-policy

      - name: Day 80 noon disposable Linux OS UID / directory denial
        run: npm run test:recovery-writer-isolation-lab

      - name: Day 80 evening mixed-version and rollback handoff review
        run: npm run test:recovery-writer-handoff

      - name: Day 80 evening disposable stale writable FD counterexample
        run: npm run test:recovery-writer-stale-fd-lab

      - name: Day 81 noon writer RPC input and authorization boundary
        run: npm run test:recovery-writer-rpc

      - name: Day 81 evening writer RPC admission, replay and revocation
        run: npm run test:recovery-writer-rpc-admission

      - name: Day 82 morning transport trust root plan review
        run: npm run test:recovery-writer-transport-plan

      - name: Day 82 noon localhost mTLS verified peer handshake
        run: npm run test:recovery-writer-mtls-peer

      - name: Day 82 evening mTLS trust rotation and post-handshake revocation
        run: npm run test:recovery-writer-mtls-rotation
